<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>RideWave — Réservations Admin</title>
  <link rel="stylesheet" href="/css/admin.css"/>
  <link rel="stylesheet" href="/css/admin-reservation.css"/>
</head>
<body>

<!-- LOADING -->
<div id="loading-screen">
  <div class="loader-logo">
    <div class="loader-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="#070709" stroke-width="2.5"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M5 17H3a2 2 0 01-2-2V5a2 2 0 012-2h11a2 2 0 012 2v3"/>
        <rect x="9" y="11" width="14" height="10" rx="2"/>
        <circle cx="12" cy="21" r="1"/><circle cx="20" cy="21" r="1"/>
      </svg>
    </div>
    Ride<span class="loader-wave">Wave</span>
  </div>
  <div class="loader-ring"></div>
  <span class="loader-text">Chargement…</span>
</div>

<!-- TOPBAR -->
<div class="topbar">
  <div class="topbar-left">
    <button class="mobile-toggle" id="mobileToggle">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <line x1="3" y1="6" x2="21" y2="6"/>
        <line x1="3" y1="12" x2="21" y2="12"/>
        <line x1="3" y1="18" x2="21" y2="18"/>
      </svg>
    </button>
    <div>
      <div class="topbar-crumb">Admin · RideWave</div>
      <div class="topbar-title">Réservations</div>
    </div>
  </div>
  <div class="topbar-right">
    <span class="topbar-date" id="tDate"></span>
    <button class="topbar-btn" id="btnRefresh" title="Actualiser">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round">
        <polyline points="23 4 23 10 17 10"/>
        <polyline points="1 20 1 14 7 14"/>
        <path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/>
      </svg>
    </button>
  </div>
</div>

<!-- CONTENU -->
<div class="content">

  <!-- ── BARRE DE RECHERCHE + FILTRES ── -->
  <div class="search-block">

    <!-- Recherche principale -->
    <div class="search-bar">
      <div class="search-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"/>
          <line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
      </div>
      <input
        type="text"
        id="searchInput"
        class="search-input"
        placeholder="Rechercher par client, voiture…"
        autocomplete="off"
      />
      <button class="search-clear" id="btnClear" title="Effacer">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"/>
          <line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>

    <!-- Filtres -->
    <div class="filters">

      <!-- Filtre statut -->
      <div class="filter-group">
        <span class="filter-label">Statut</span>
        <div class="filter-tabs" id="filterStatut">
          <button class="ftab active" data-val="">Toutes</button>
          <button class="ftab" data-val="confirmee">
            <span class="ftab-dot ok"></span>Confirmées
          </button>
          <button class="ftab" data-val="annulee">
            <span class="ftab-dot ko"></span>Annulées
          </button>
        </div>
      </div>

      <!-- Filtre date -->
      <div class="filter-group">
        <span class="filter-label">Date de début</span>
        <div class="date-range">
          <div class="date-input-wrap">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="4" width="18" height="18" rx="2"/>
              <line x1="16" y1="2" x2="16" y2="6"/>
              <line x1="8" y1="2" x2="8" y2="6"/>
              <line x1="3" y1="10" x2="21" y2="10"/>
            </svg>
            <input type="date" id="dateFrom" class="date-input" title="Du"/>
          </div>
          <span class="date-sep">→</span>
          <div class="date-input-wrap">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="4" width="18" height="18" rx="2"/>
              <line x1="16" y1="2" x2="16" y2="6"/>
              <line x1="8" y1="2" x2="8" y2="6"/>
              <line x1="3" y1="10" x2="21" y2="10"/>
            </svg>
            <input type="date" id="dateTo" class="date-input" title="Au"/>
          </div>
        </div>
      </div>

      <!-- Bouton reset filtres -->
      <button class="btn-reset-filters" id="btnResetFilters" title="Réinitialiser les filtres">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="1 4 1 10 7 10"/>
          <path d="M3.51 15a9 9 0 102.13-9.36L1 10"/>
        </svg>
        Réinitialiser
      </button>

    </div>

    <!-- Résumé résultats -->
    <div class="results-summary" id="resultsSummary"></div>

  </div>

  <!-- ── TABLEAU ── -->
  <div class="table-card">
    <div class="tc-header">
      <span class="tc-title">Liste des réservations</span>
      <span class="tc-count" id="tcCount"></span>
    </div>
    <div class="table-wrap">
      <table class="rw-table">
        <thead>
          <tr>
            <th>ID</th>
            <th>Client</th>
            <th>Voiture</th>
            <th>Date début</th>
            <th>Date fin</th>
            <th>Durée</th>
            <th>Total</th>
            <th>Statut</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>

    <!-- Pagination -->
    <div class="pagination" id="pagination"></div>
  </div>

</div><!-- /content -->

<!-- MODAL CONFIRMATION ANNULATION -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/>
        <line x1="12" y1="8" x2="12" y2="12"/>
        <line x1="12" y1="16" x2="12.01" y2="16"/>
      </svg>
    </div>
    <h3 class="modal-title">Annuler la réservation ?</h3>
    <p class="modal-text">
      Cette action est irréversible. La réservation passera au statut
      <strong>annulée</strong>.
    </p>
    <div class="modal-actions">
      <button class="btn-modal-cancel" id="btnModalCancel">Retour</button>
      <button class="btn-modal-confirm" id="btnModalConfirm">Confirmer l'annulation</button>
    </div>
  </div>
</div>

<script src="/js/admin-reservations.js"></script>
</body>
</html>
