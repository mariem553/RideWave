<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>RideWave — Voitures Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600;1,700&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="/css/admin.css"/>
  <link rel="stylesheet" href="/css/voitures-admin.css"/>
</head>
<body>

<!-- LOADING -->
<div id="loading-screen">
  <div class="loader-logo">
    <div class="loader-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="#070709" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M5 17H3a2 2 0 01-2-2V5a2 2 0 012-2h11a2 2 0 012 2v3"/>
        <rect x="9" y="11" width="14" height="10" rx="2"/>
        <circle cx="12" cy="21" r="1"/><circle cx="20" cy="21" r="1"/>
      </svg>
    </div>
    Ride<span class="loader-wave">Wave</span>
  </div>
  <div class="loader-ring"></div>
  <span class="loader-text">Chargement…</span>
</div>

<div class="admin-wrap">

  <aside class="sidebar" id="sidebar"></aside>
  <div class="sb-overlay" id="sbOverlay"></div>

  <main class="admin-main">

    <!-- TOPBAR -->
    <div class="topbar">
      <div class="topbar-left">
        <button class="mobile-toggle" id="mobileToggle">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/>
          </svg>
        </button>
        <div>
          <div class="topbar-crumb">Admin · RideWave</div>
          <div class="topbar-title">Gestion des voitures</div>
        </div>
      </div>
      <div class="topbar-right">
        <span class="topbar-date" id="tDate"></span>
      </div>
    </div>

    <!-- CONTENU -->
    <div class="content" style="padding-bottom:0">

      <div class="page-header">
        <div>
          <div class="page-title">Flotte RideWave</div>
          <div class="page-subtitle" id="fleet-subtitle">Chargement…</div>
        </div>
        <div class="header-right">
          <div class="stats-pills">
            <span class="stat-pill"        id="stat-total">— total</span>
            <span class="stat-pill green"  id="stat-dispo">— disponibles</span>
            <span class="stat-pill red"    id="stat-indispo">— indisponibles</span>
          </div>
          <button class="btn-add" onclick="openAdd()">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
            </svg>
            Ajouter
          </button>
        </div>
      </div>

      <div class="split">

        <!-- Liste -->
        <div class="list-panel">
          <div class="list-top">
            <div class="search-wrap">
              <svg class="search-ico" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
              </svg>
              <input type="text" id="search" placeholder="Rechercher…" oninput="renderList()"/>
            </div>
            <select class="filter-sel" id="f-cat" onchange="renderList()">
              <option value="">Tous</option>
              <option value="Berline">Berline</option>
              <option value="SUV">SUV</option>
              <option value="Compacte">Compacte</option>
              <option value="Électrique">Électrique</option>
            </select>
            <select class="filter-sel" id="f-dispo" onchange="renderList()">
              <option value="">Statut</option>
              <option value="1">Disponible</option>
              <option value="0">Indisponible</option>
            </select>
          </div>
          <div class="list-body" id="list-body"></div>
        </div>

        <!-- Détail -->
        <div class="detail-panel" id="detail-panel">
          <div class="empty">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="rgba(201,169,98,0.25)" stroke-width="1.5">
              <path d="M5 17H3v-5l2-5h14l2 5v5h-2"/><circle cx="7.5" cy="17.5" r="2.5"/><circle cx="16.5" cy="17.5" r="2.5"/>
            </svg>
            Sélectionnez une voiture
          </div>
        </div>

      </div>
    </div>

    <!-- MODAL VOITURE -->
    <div id="modal-overlay" class="modal-overlay">
      <div class="modal-box">
        <div class="modal-header">
          <h2 id="modal-title">Ajouter une voiture</h2>
          <button class="btn-close" onclick="closeModal()">✕</button>
        </div>
        <div class="modal-fields">
          <div class="grid-2">
            <div><label>Marque *</label><input id="form-marque" type="text" class="admin-input" placeholder="ex: Mercedes-Benz"/></div>
            <div><label>Modèle *</label><input id="form-modele" type="text" class="admin-input" placeholder="ex: Classe E 220d"/></div>
          </div>
          <div class="grid-2">
            <div><label>Année *</label><input id="form-annee" type="number" class="admin-input" placeholder="2026"/></div>
            <div><label>Prix/jour (TND) *</label><input id="form-prix" type="number" class="admin-input" placeholder="320"/></div>
          </div>
          <div class="grid-2">
            <div>
              <label>Catégorie</label>
              <select id="form-cat" class="admin-input">
                <option value="Berline">Berline</option>
                <option value="SUV">SUV</option>
                <option value="Compacte">Compacte</option>
                <option value="Électrique">Électrique</option>
              </select>
            </div>
            <div>
              <label>Carburant</label>
              <select id="form-carburant" class="admin-input">
                <option value="Essence">Essence</option>
                <option value="Diesel">Diesel</option>
                <option value="Hybride">Hybride</option>
                <option value="Électrique">Électrique</option>
              </select>
            </div>
          </div>
          <div class="grid-2">
            <div>
              <label>Transmission</label>
              <select id="form-transmission" class="admin-input">
                <option value="Auto">Automatique</option>
                <option value="Manuel">Manuelle</option>
              </select>
            </div>
            <div><label>Places</label><input id="form-places" type="number" class="admin-input" placeholder="5"/></div>
          </div>
          <div><label>URL Photo</label><input id="form-photo" type="text" class="admin-input" placeholder="https://…"/></div>
          <div>
            <label>Texte descriptif (page d’accueil)</label>
            <textarea id="form-description" class="admin-input" rows="3" placeholder="Court texte marketing sous le titre sur la carte d’accueil…"></textarea>
          </div>
          <div class="grid-2">
            <div><label>Puissance (affichée « chevaux »)</label><input id="form-puissance" type="text" class="admin-input" placeholder="ex: 130"/></div>
            <div><label>Vitesse max (km/h)</label><input id="form-vmax" type="text" class="admin-input" placeholder="ex: 210"/></div>
          </div>
          <div>
            <label>Accélération 0 → 100 km/h</label>
            <input id="form-accel" type="text" class="admin-input" placeholder="ex: 10,5 s"/>
          </div>
          <div class="checkbox-row">
            <input id="form-dispo" type="checkbox" checked/>
            <label for="form-dispo">Disponible à la location</label>
          </div>
        </div>
        <div class="modal-footer">
          <button class="btn-annuler-modal" onclick="closeModal()">Annuler</button>
          <button class="btn-enregistrer"   onclick="saveVoiture()">Enregistrer</button>
        </div>
      </div>
    </div>

  </main>
</div>

<script src="/js/admin-sidebar.js"></script>
<script src="/js/admin-voitures.js"></script>
</body>
</html>
