<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Réservez une voiture - RideWave" />
  <title>RideWave | Réservation</title>

  <!-- Fonts Google -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,600&family=DM+Sans:wght@300;400;500;600;700&display=swap"
    rel="stylesheet"
  />

  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- CSS COMMUN -->
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <!-- NAVBAR -->
  <nav class="nav-container" id="navbar">
    <div style="max-width:1280px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;">
      <a href="/" class="nav-logo">
        <div class="nav-logo-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#070709" stroke-width="2.5">
            <path d="M5 17H3a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11a2 2 0 0 1 2 2v3"/>
            <rect x="9" y="11" width="14" height="10" rx="2"/>
            <circle cx="12" cy="21" r="1"/>
            <circle cx="20" cy="21" r="1"/>
          </svg>
        </div>
        <span class="nav-logo-text">RIDE<span class="wave">Wave</span></span>
      </a>

      <ul class="nav-links">
        <li><a href="/" class="nav-link">Accueil</a></li>
      </ul>

      <div class="nav-actions">
        <a href="/views/login.html" class="nav-signin" id="nav-signin-link">Connexion</a>
        <a href="/views/profile.html" class="nav-signin" id="nav-profile-link" style="display:none;">Mon Profil</a>
      </div>
    </div>
  </nav>

  <!-- MAIN -->
  <main style="padding: 120px 24px 80px;">
    <div style="max-width: 1200px; margin: 0 auto;">
      <h1 style="font-family: 'Cormorant Garamond', serif; font-size: 2.7rem; letter-spacing: 0.02em; margin-bottom: 12px;">Confirmez votre réservation</h1>
      <p style="color: var(--muted); margin-bottom: 40px;">Voiture, dates et détails de votre réservation</p>

      <div style="display: grid; grid-template-columns: 1fr 380px; gap: 32px;">
        <!-- COLONNE GAUCHE — Détails -->
        <div>

          <!-- 1. VOITURE -->
          <div class="glass-panel" style="padding: 24px; margin-bottom: 24px;">
            <h2 style="font-size: 1.2rem; font-weight: 700; margin-bottom: 16px;">Voiture choisie</h2>
            <div style="display: flex; gap: 18px; align-items: flex-start;">
              <img id="car-image" src="" alt="Voiture" style="width: 200px; height: 140px; object-fit: cover; border-radius: 14px;" />
              <div style="flex: 1;">
                <div id="car-name" style="font-size: 1.1rem; font-weight: 700;">—</div>
                <div id="car-category" style="color: var(--muted); font-size: 0.9rem; margin-top: 4px;">—</div>
                <div id="car-price" style="color: var(--accent); font-weight: 600; font-size: 1rem; margin-top: 8px;">—</div>
              </div>
            </div>
          </div>

          <!-- 2. INFORMATIONS CLIENT -->
          <div class="glass-panel" style="padding: 24px; margin-bottom: 24px;">
            <h2 style="font-size: 1.2rem; font-weight: 700; margin-bottom: 16px;">Informations client</h2>

            <div style="margin-bottom: 16px;">
              <label style="display: block; font-size: 0.85rem; color: var(--muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.05em;">Nom</label>
              <input type="text" id="client-last-name" required class="input-field" style="width: 100%; padding: 14px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; color: var(--fg);" />
            </div>

            <div style="margin-bottom: 16px;">
              <label style="display: block; font-size: 0.85rem; color: var(--muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.05em;">Prénom</label>
              <input type="text" id="client-first-name" required class="input-field" style="width: 100%; padding: 14px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; color: var(--fg);" />
            </div>

            <div style="margin-bottom: 16px;">
              <label style="display: block; font-size: 0.85rem; color: var(--muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.05em;">Adresse e-mail</label>
              <input type="email" id="client-email" required class="input-field" style="width: 100%; padding: 14px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; color: var(--fg);" />
            </div>

            <div style="margin-bottom: 16px;">
              <label style="display: block; font-size: 0.85rem; color: var(--muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.05em;">Téléphone</label>
              <input type="tel" id="client-phone" required pattern="[0-9\s+\-]{6,20}" class="input-field" style="width: 100%; padding: 14px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; color: var(--fg);" />
            </div>

            <div style="margin-bottom: 16px;">
              <label style="display: block; font-size: 0.85rem; color: var(--muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.05em;">N° Carte d'identité (CIN)</label>
              <input type="text" id="client-cin" required placeholder="Ex : 12345678" maxlength="20" autocomplete="off" class="input-field" style="width: 100%; padding: 14px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; color: var(--fg);" />
            </div>
          </div>

          <!-- 3. DATES DE LOCATION -->
          <div class="glass-panel" style="padding: 24px; margin-bottom: 24px;">
            <h2 style="font-size: 1.2rem; font-weight: 700; margin-bottom: 16px;">Dates de location</h2>
            
            <div style="margin-bottom: 18px;">
              <label style="display: block; font-size: 0.85rem; color: var(--muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.05em;">Date de départ</label>
              <input type="date" id="start-date" class="input-field" style="width: 100%; padding: 14px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; color: var(--fg);" />
            </div>

            <div style="margin-bottom: 18px;">
              <label style="display: block; font-size: 0.85rem; color: var(--muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.05em;">Date de retour</label>
              <input type="date" id="end-date" class="input-field" style="width: 100%; padding: 14px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; color: var(--fg);" />
            </div>
          </div>

          <!-- 4. OPTIONS -->
          <div class="glass-panel" style="padding: 24px; margin-bottom: 24px;">
            <h2 style="font-size: 1.2rem; font-weight: 700; margin-bottom: 16px;">Options supplémentaires</h2>
            
            <label style="display: flex; align-items: center; gap: 12px; cursor: pointer; padding: 12px; background: rgba(255,255,255,0.02); border-radius: 10px; border: 1px solid rgba(255,255,255,0.08); transition: all 0.3s ease;">
              <input type="checkbox" id="driver-option" style="width: 20px; height: 20px; cursor: pointer;" />
              <div>
                <div style="font-weight: 600;">Ajouter un chauffeur</div>
                <div style="font-size: 0.85rem; color: var(--muted);">+30 DT par jour</div>
              </div>
            </label>
          </div>

        </div>

        <!-- COLONNE DROITE — Récapitulatif -->
        <div>
          <div class="glass-panel" style="padding: 24px; position: sticky; top: 120px;">
            <h2 style="font-size: 1.1rem; font-weight: 700; margin-bottom: 18px;">Récapitulatif</h2>

            <div style="display: flex; justify-content: space-between; margin-bottom: 8px; padding-bottom: 8px; border-bottom: 1px solid rgba(255,255,255,0.1);">
              <span style="color: var(--muted);">Prix/jour</span>
              <span id="recap-price-day">0 DT</span>
            </div>

            <div style="display: flex; justify-content: space-between; margin-bottom: 8px; padding-bottom: 8px; border-bottom: 1px solid rgba(255,255,255,0.1);">
              <span style="color: var(--muted);">Jours</span>
              <span id="recap-days">0</span>
            </div>

            <div style="display: flex; justify-content: space-between; margin-bottom: 8px; padding-bottom: 8px; border-bottom: 1px solid rgba(255,255,255,0.1);">
              <span style="color: var(--muted);">Sous-total</span>
              <span id="recap-subtotal">0 DT</span>
            </div>

            <div style="display: flex; justify-content: space-between; margin-bottom: 14px; padding-bottom: 8px; border-bottom: 1px solid rgba(255,255,255,0.1);">
              <span style="color: var(--muted);">Chauffeur</span>
              <span id="recap-driver">0 DT</span>
            </div>

            <div style="display: flex; justify-content: space-between; font-weight: 700; font-size: 1.15rem; margin-bottom: 20px; padding: 14px; background: rgba(201,169,98,0.1); border-radius: 10px;">
              <span>Total</span>
              <span id="recap-total">0 DT</span>
            </div>

            <button id="btn-confirm" class="btn-luxury" style="width: 100%;">
              <span class="btn-inner">Confirmer la réservation</span>
            </button>

            <div id="confirmation-msg" style="margin-top: 12px; padding: 12px; border-radius: 10px; font-size: 0.9rem; display: none;"></div>
          </div>
        </div>
      </div>

    </div>
  </main>

  <script src="/js/main.js"></script>
  <script src="/js/reservation.js"></script>
</body>
</html>
